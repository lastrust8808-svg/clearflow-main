<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Clear-Flow Logo">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="50%" stop-color="#005A9E"/>
      <stop offset="50%" stop-color="#4CAF50"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="0" cy="0" r="48"/>
    </clipPath>
  </defs>

  <g transform="translate(50, 50)">
    <g clip-path="url(#circleClip)">
      <rect x="-50" y="-50" width="100" height="100" fill="url(#logoGradient)"/>
      <path d="M -45,-18 C -20,-42 25,12 45,-8" stroke="#ffffff" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M -45,18 C -25,42 15,-18 45,8" stroke="#ffffff" stroke-width="11" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <text
    x="112"
    y="70"
    font-family="'Saira', 'Segoe UI', sans-serif"
    font-weight="700"
    font-style="italic"
    font-size="54"
    letter-spacing="-2"
  >
    <tspan fill="#005A9E">Clear-</tspan>
    <tspan fill="#4CAF50">Flow</tspan>
  </text>
</svg>
