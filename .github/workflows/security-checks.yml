name: Security checks
on:
  pull_request:
  push:
    branches:
      - security/hardening-2026-10-12
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: |
          for file in server.js server/routes/*.js server/middleware/*.js server/services/*.js; do
            node --check "$file"
          done
