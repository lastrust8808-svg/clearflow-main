name: Security dependency vulnerability audit

on:
  push:
    branches:
      - security/infrastructure-audit-2026-10-28
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked production dependencies for high or critical advisories
        run: npm audit --package-lock-only --omit=dev --audit-level=high
