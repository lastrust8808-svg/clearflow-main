name: Security dependency vulnerability audit

on:
  push:
    branches:
      - security/infrastructure-audit-2026-10-28
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked production dependencies and retain machine-readable evidence
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --omit=dev --audit-level=high --json > dependency-audit.json
          result=$?
          set -e
          # npm audit returns 1 for findings above the threshold; never mask other failures.
          if [ "$result" -ne 0 ]; then
            echo "Dependency audit failed (exit $result); see uploaded JSON report." >&2
          fi
          exit "$result"
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit-json
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
