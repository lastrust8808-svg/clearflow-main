name: Integration storage path regression

on:
  push:
    branches:
      - work/integration-registration-persistence-2026-11-02
  pull_request:
    paths:
      - server/services/accountStorage.js
      - server/utils/storageSegment.js
      - tests/storageSegment.test.mjs
      - .github/workflows/integration-storage-path.yml

permissions:
  contents: read

jobs:
  storage-segment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server/utils/storageSegment.js
          node --check server/services/accountStorage.js
      - name: Storage identifier regression
        run: node --test tests/storageSegment.test.mjs
