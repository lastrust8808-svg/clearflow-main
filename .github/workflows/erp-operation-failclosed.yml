name: ERP operation fail-closed guards
on:
  pull_request:
    paths:
      - 'src/services/erpOperations.service.ts'
      - 'tests/erpOperationsFailures.test.mjs'
      - '.github/workflows/erp-operation-failclosed.yml'
  push:
    branches:
      - 'workstream/erp-business-operations-2026-10-28'
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/erpOperationsFailures.test.mjs
