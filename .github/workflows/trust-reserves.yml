name: Trust reserves and note invariants
on:
  pull_request:
    paths:
      - 'server/services/reserveCapacity.js'
      - 'server/services/reserveJournal.js'
      - 'tests/reserveJournal.test.js'
      - 'tests/reserveJournalDescriptorReads.test.js'
      - 'tests/reserve*.test.js'
      - 'server/services/noteAmortization.js'
      - 'tests/note*.test.js'
      - 'server/services/trusteeSigningPolicy.js'
      - 'tests/trustee*.test.js'
      - 'server/services/privateNoteLifecycle.js'
      - 'tests/privateNoteLifecycle.test.js'
      - 'server/services/trustDocumentVersionPolicy.js'
      - 'tests/trustDocument*.test.js'
      - 'server/services/trustDocumentQrPolicy.js'
      - 'server/services/trustDocumentQrApprovedOrigin.js'
      - 'tests/trustQr*.test.js'
      - 'tests/trustSigningNoncharacters.test.js'
      - 'server/services/trustDocumentQrRegistryPolicy.js'
      - 'server/services/trustDocumentSigningEvidence.js'
      - 'tests/trustSigning*.test.js'
      - 'server/services/enforcementNoticeGate.js'
      - 'server/services/enforcementNoticeFingerprint.js'
      - 'tests/enforcementNotice*.test.js'
      - '.github/workflows/trust-reserves.yml'
  push:
    branches: [main]
    paths:
      - 'server/services/reserveJournal.js'
      - 'tests/reserveJournal.test.js'
      - 'tests/reserveJournalDescriptorReads.test.js'
      - 'server/services/reserveCapacity.js'
      - 'tests/reserve*.test.js'
      - 'server/services/noteAmortization.js'
      - 'tests/note*.test.js'
      - 'server/services/trusteeSigningPolicy.js'
      - 'tests/trustee*.test.js'
      - 'server/services/privateNoteLifecycle.js'
      - 'tests/privateNoteLifecycle.test.js'
      - 'server/services/trustDocumentVersionPolicy.js'
      - 'tests/trustDocument*.test.js'
      - 'server/services/trustDocumentQrPolicy.js'
      - 'server/services/trustDocumentQrApprovedOrigin.js'
      - 'tests/trustQr*.test.js'
      - 'tests/trustSigningNoncharacters.test.js'
      - 'server/services/trustDocumentQrRegistryPolicy.js'
      - 'server/services/trustDocumentSigningEvidence.js'
      - 'tests/trustSigning*.test.js'
      - 'server/services/enforcementNoticeGate.js'
      - 'server/services/enforcementNoticeFingerprint.js'
      - 'tests/enforcementNotice*.test.js'
permissions:
  contents: read
jobs:
  trust-financial-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/services/reserveCapacity.js
      - run: node --check server/services/reserveJournal.js
      - run: node --check server/services/noteAmortization.js
      - run: node --check server/services/trusteeSigningPolicy.js
      - run: node --check server/services/privateNoteLifecycle.js
      - run: node --check server/services/trustDocumentVersionPolicy.js
      - run: node --check server/services/trustDocumentQrApprovedOrigin.js
      - run: node --check server/services/trustDocumentQrPolicy.js
      - run: node --check server/services/trustDocumentQrRegistryPolicy.js
      - run: node --check server/services/trustDocumentSigningEvidence.js
      - run: node --check server/services/enforcementNoticeGate.js
      - run: node --check server/services/enforcementNoticeFingerprint.js
      - run: node --test tests/reserve*.test.js tests/note*.test.js tests/trustee*.test.js tests/privateNoteLifecycle.test.js tests/trustDocument*.test.js tests/trustQrRegistryIdentifierHardening.test.js tests/trustSigningNoncharacters.test.js tests/trustSigning*.test.js tests/enforcementNotice*.test.js
